[versions]
# Build toolchain
agp                     = "8.7.2"
kotlin                  = "2.1.10"
ksp                     = "2.1.10-1.0.31"

# AndroidX core
coreKtx                 = "1.15.0"
lifecycleRuntimeKtx     = "2.8.7"
activityCompose         = "1.10.1"

# Compose BOM (pins all compose.* versions together)
composeBom              = "2025.02.00"

# Compose for TV
tvMaterial              = "1.0.0"
tvFoundation            = "1.0.0-alpha11"

# Media3 / ExoPlayer
media3                  = "1.5.1"

# Networking
okhttp                  = "4.12.0"

# Image loading
coil                    = "2.7.0"

# Room
room                    = "2.7.1"

# DataStore
datastore               = "1.1.2"

# Kotlinx Serialization (for any JSON parsing utilities)
kotlinxSerialization    = "1.8.0"

# Coroutines
coroutines              = "1.10.1"

# Navigation Compose
navigationCompose       = "2.8.7"

# Splash Screen
splashscreen            = "1.0.1"

[libraries]
# AndroidX
androidx-core-ktx                       = { group = "androidx.core",             name = "core-ktx",               version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx          = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",  version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose    = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose               = { group = "androidx.activity",          name = "activity-compose",       version.ref = "activityCompose" }
androidx-splashscreen                   = { group = "androidx.core",              name = "core-splashscreen",      version.ref = "splashscreen" }

# Compose BOM + core UI
androidx-compose-bom                    = { group = "androidx.compose",           name = "compose-bom",            version.ref = "composeBom" }
androidx-compose-ui                     = { group = "androidx.compose.ui",        name = "ui" }
androidx-compose-ui-graphics            = { group = "androidx.compose.ui",        name = "ui-graphics" }
androidx-compose-ui-tooling-preview     = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
androidx-compose-material3              = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-ui-tooling             = { group = "androidx.compose.ui",        name = "ui-tooling" }
androidx-compose-ui-test-manifest       = { group = "androidx.compose.ui",        name = "ui-test-manifest" }

# Compose for TV
androidx-tv-material                    = { group = "androidx.tv",                name = "tv-material",            version.ref = "tvMaterial" }
androidx-tv-foundation                  = { group = "androidx.tv",                name = "tv-foundation",          version.ref = "tvFoundation" }

# Navigation
androidx-navigation-compose             = { group = "androidx.navigation",        name = "navigation-compose",     version.ref = "navigationCompose" }

# Media3 / ExoPlayer
androidx-media3-exoplayer               = { group = "androidx.media3",            name = "media3-exoplayer",       version.ref = "media3" }
androidx-media3-exoplayer-hls           = { group = "androidx.media3",            name = "media3-exoplayer-hls",   version.ref = "media3" }
androidx-media3-exoplayer-dash          = { group = "androidx.media3",            name = "media3-exoplayer-dash",  version.ref = "media3" }
androidx-media3-datasource-okhttp       = { group = "androidx.media3",            name = "media3-datasource-okhttp", version.ref = "media3" }
androidx-media3-ui                      = { group = "androidx.media3",            name = "media3-ui",              version.ref = "media3" }
androidx-media3-session                 = { group = "androidx.media3",            name = "media3-session",         version.ref = "media3" }

# Networking
okhttp-core                             = { group = "com.squareup.okhttp3",       name = "okhttp",                 version.ref = "okhttp" }
okhttp-logging                          = { group = "com.squareup.okhttp3",       name = "logging-interceptor",    version.ref = "okhttp" }

# Image loading
coil-compose                            = { group = "io.coil-kt",                 name = "coil-compose",           version.ref = "coil" }

# Room
room-runtime                            = { group = "androidx.room",              name = "room-runtime",           version.ref = "room" }
room-ktx                                = { group = "androidx.room",              name = "room-ktx",               version.ref = "room" }
room-compiler                           = { group = "androidx.room",              name = "room-compiler",          version.ref = "room" }

# DataStore
datastore-preferences                   = { group = "androidx.datastore",         name = "datastore-preferences",  version.ref = "datastore" }

# Kotlinx
kotlinx-serialization-json              = { group = "org.jetbrains.kotlinx",      name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android              = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
android-application         = { id = "com.android.application",               version.ref = "agp" }
kotlin-android              = { id = "org.jetbrains.kotlin.android",           version.ref = "kotlin" }
kotlin-compose              = { id = "org.jetbrains.kotlin.plugin.compose",    version.ref = "kotlin" }
kotlin-serialization        = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                         = { id = "com.google.devtools.ksp",                version.ref = "ksp" }
